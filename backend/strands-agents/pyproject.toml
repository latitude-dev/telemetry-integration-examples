[project]
name = "strands-agents-backend"
version = "0.1.0"
description = "Strands Agents backend for Wikipedia article generation"
authors = [
    { name = "Latitude", email = "manu@latitude.so" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "strands-agents[otel]==1.41.0",
    "openai==2.16.0",
    "python-dotenv==1.2.1",
    "fastapi==0.128.0",
    "uvicorn==0.39.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
